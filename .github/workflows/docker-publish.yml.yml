name: Build and Push to ACR

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
            docker login crpi-66pjm0oi7g763epj.cn-hangzhou.personal.cr.aliyuncs.com \
            -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          IMAGE=crpi-66pjm0oi7g763epj.cn-hangzhou.personal.cr.aliyuncs.com/park_java/park-java
          TAG=${{ github.sha }}

          docker build -t $IMAGE:$TAG -t $IMAGE:latest .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Deploy to JD Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            IMAGE=crpi-66pjm0oi7g763epj.cn-hangzhou.personal.cr.aliyuncs.com/park_java/park-java
            TAG=latest

            echo "${{ secrets.ACR_PASSWORD }}" | \
              docker login crpi-66pjm0oi7g763epj.cn-hangzhou.personal.cr.aliyuncs.com \
              -u "${{ secrets.ACR_USERNAME }}" --password-stdin

            # 数据库/JWT/COS/微信等敏感配置全部在服务器本地 env 文件（root:600），
            # 不进 GitHub、不进镜像。文件内需含：
            #   MYSQL_URL / MYSQL_USER / MYSQL_PASSWORD / JWT_SECRET
            #   COS_SECRET_ID / COS_SECRET_KEY
            #   WECHAT_MINIAPP_APP_ID / WECHAT_MINIAPP_SECRET
            # 缺文件必须在删掉旧容器之前失败，否则线上服务会被删掉却起不来新的。
            ENV_FILE=/data/park/java.env
            [ -f "$ENV_FILE" ] || { echo "missing $ENV_FILE" >&2; exit 1; }

            # 先拉取成功才动旧容器，避免部署失败导致服务中断
            docker pull $IMAGE:$TAG

            # nginx 代理的是宿主机 3429 端口，旧容器（手工部署）就叫 park-java
            docker rm -f park-java 2>/dev/null || true

            # 日志持久化：logback 写 /app/logs，挂载到宿主机（容器内 spring 用户 uid=100）
            mkdir -p /data/park/java-logs && chown -R 100:100 /data/park/java-logs

            docker run -d \
              --name park-java \
              --restart unless-stopped \
              -p 3429:3429 \
              -v /data/park/java-logs:/app/logs \
              --env-file "$ENV_FILE" \
              $IMAGE:$TAG

            docker image prune -f
