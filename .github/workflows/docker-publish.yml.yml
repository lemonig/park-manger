name: Build and Push to ACR

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
            docker login crpi-66pjm0oi7g763epj.cn-hangzhou.personal.cr.aliyuncs.com \
            -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          IMAGE=crpi-66pjm0oi7g763epj.cn-hangzhou.personal.cr.aliyuncs.com/park_java/park-java
          TAG=${{ github.sha }}

          docker build -t $IMAGE:$TAG -t $IMAGE:latest .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Deploy to JD Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            IMAGE=crpi-66pjm0oi7g763epj.cn-hangzhou.personal.cr.aliyuncs.com/park_java/park-java
            TAG=latest

            echo "${{ secrets.ACR_PASSWORD }}" | \
              docker login crpi-66pjm0oi7g763epj.cn-hangzhou.personal.cr.aliyuncs.com \
              -u "${{ secrets.ACR_USERNAME }}" --password-stdin

            # 先拉取成功才动旧容器，避免部署失败导致服务中断
            docker pull $IMAGE:$TAG

            # nginx 代理的是宿主机 3429 端口，旧容器（手工部署）就叫 park-java
            docker rm -f park-java 2>/dev/null || true

            # 日志持久化：logback 写 /app/logs，挂载到宿主机（容器内 spring 用户 uid=100）
            mkdir -p /data/park/java-logs && chown -R 100:100 /data/park/java-logs

            docker run -d \
              --name park-java \
              --restart unless-stopped \
              -p 3429:3429 \
              -v /data/park/java-logs:/app/logs \
              -e WECHAT_MINIAPP_APP_ID="${{ secrets.WECHAT_MINIAPP_APP_ID }}" \
              -e WECHAT_MINIAPP_SECRET="${{ secrets.WECHAT_MINIAPP_SECRET }}" \
              $IMAGE:$TAG

            docker image prune -f
