# ================== Production Config ==================

# Server port
server.port=${port:3429}

# Disable Swagger in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ================== Database ==================

# 生产环境连接信息一律通过环境变量注入，不提供任何默认值：
# 缺失时应用会在启动阶段直接失败（占位符无法解析），避免带着错误配置上线。
mysql.url=${MYSQL_URL}
mysql.user=${MYSQL_USER}
mysql.password=${MYSQL_PASSWORD}
mysql.driverClassName=com.mysql.cj.jdbc.Driver

# HikariCP pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ================== MyBatis & PageHelper ==================

mybatis.configuration.map-underscore-to-camel-case=true

pagehelper.offset-as-page-num=true
pagehelper.reasonable=true
pagehelper.page-size-zero=true
pagehelper.support-methods-arguments=true
pagehelper.helperDialect=mysql
pagehelper.params=count=countSql

# ================== Logging ==================

logging.level.root=info
logging.level.com.park=info
logging.level.org.mybatis=warn
logging.file.path=./logs

# ================== JWT Security ==================

jwt.secret=${JWT_SECRET}
jwt.mini.ttl=${JWT_MINI_TTL:2592000}
jwt.mini.refresh-threshold=${JWT_MINI_REFRESH_THRESHOLD:604800}

# ================== WeChat Mini-Program ==================
# 走 jscode2session 静默登录；通过部署环境变量注入 WECHAT_MINIAPP_APP_ID / WECHAT_MINIAPP_SECRET。
# UserService 通过 @Value 直接读取环境变量，不要在此文件写占位（会与同名 env 循环引用）。

# ================== Tencent COS ==================

tencent.cos.bucket-name=${COS_BUCKET:parkbucket-1258553345}
tencent.cos.secretId=${COS_SECRET_ID}
tencent.cos.secretKey=${COS_SECRET_KEY}
tencent.cos.region=${COS_REGION:ap-guangzhou}
tencent.cos.base-url=${COS_BASE_URL:parkbucket-1258553345.cos.ap-guangzhou.myqcloud.com}
tencent.cos.prefix=uploads/

# ================== File Upload ==================

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ================== Server Timeout ==================

server.tomcat.connection-timeout=60000
server.servlet.session.timeout=1800
