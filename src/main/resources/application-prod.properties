# ================== Production Config ==================

# Server port
server.port=${port:3429}

# Disable Swagger in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ================== Database ==================

mysql.url=jdbc:mysql://mysql-internet-cn-north-1-336723bd277f4c12.rds.jdcloud.com:3306/park?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai
mysql.user=${MYSQL_USER:sqluser}
mysql.password=${MYSQL_PASSWORD:plum!321}
mysql.driverClassName=com.mysql.cj.jdbc.Driver

# HikariCP pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ================== MyBatis & PageHelper ==================

mybatis.configuration.map-underscore-to-camel-case=true

pagehelper.offset-as-page-num=true
pagehelper.reasonable=true
pagehelper.page-size-zero=true
pagehelper.support-methods-arguments=true
pagehelper.helperDialect=mysql
pagehelper.params=count=countSql

# ================== Logging ==================

logging.level.root=info
logging.level.com.park=info
logging.level.org.mybatis=warn
logging.file.path=./logs

# ================== JWT Security ==================

jwt.secret=${JWT_SECRET:park_secure_secret_key_2024_abcdefghijklmnopqrstuvwxyz1234567890}
jwt.mini.ttl=${JWT_MINI_TTL:2592000}
jwt.mini.refresh-threshold=${JWT_MINI_REFRESH_THRESHOLD:604800}

# ================== Redis ==================

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DB:0}
spring.data.redis.timeout=3s

# ================== Tencent COS ==================

