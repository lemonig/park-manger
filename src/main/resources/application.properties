spring.application.name=park
spring.profiles.active=dev

# 上传限制：单文件 8MB（小程序图片上限），整包 10MB 留出 multipart 封装余量
# 注意：之前只配在 prod，容器实际跑 dev 时吃默认值 1MB，导致小程序传图几乎必然失败
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB


mysql.driverClassName=com.mysql.cj.jdbc.Driver

pagehelper.offset-as-page-num=true
pagehelper.reasonable=true
pagehelper.page-size-zero=true
pagehelper.support-methods-arguments=true
pagehelper.helperDialect=mysql
pagehelper.params=count=countSql

# Swagger ?????)
springdoc.swagger-ui.path=/swagger-ui.html
# API 文档路径
springdoc.api-docs.path=/v3/api-docs
# 是否启用 swagger-ui
springdoc.swagger-ui.enabled=true

# ??? COS ??????
# secretId/secretKey 一律通过环境变量注入（COS_SECRET_ID / COS_SECRET_KEY），禁止写进仓库
tencent.cos.bucket-name = ${COS_BUCKET:parkbucket-1258553345}
tencent.cos.secretId = ${COS_SECRET_ID:}
tencent.cos.secretKey = ${COS_SECRET_KEY:}
tencent.cos.region = ${COS_REGION:ap-guangzhou}
tencent.cos.base-url = ${COS_BASE_URL:parkbucket-1258553345.cos.ap-guangzhou.myqcloud.com}
tencent.cos.prefix = uploads/



# MyBatis ?? - ????????
mybatis.configuration.map-underscore-to-camel-case=true

# JWT 签名密钥：通过环境变量 JWT_SECRET 注入（不少于 32 字节），未配置时 token 签发/校验会失败
jwt.secret=${JWT_SECRET:}
# 小程序 token 30 天有效期（秒）
jwt.mini.ttl=2592000
# 剩余时长（秒）低于该阈值时触发自动续期
jwt.mini.refresh-threshold=604800


