app.name=park

#network
server.port=${port:3429}
# 数据库连接通过环境变量注入（MYSQL_URL / MYSQL_USER / MYSQL_PASSWORD），默认指向本机 MySQL。
# 真实连接串与密码禁止写进仓库。
mysql.user=${MYSQL_USER:root}
mysql.password=${MYSQL_PASSWORD:}
mysql.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/park?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}

logging.level.com=info

# ?????? DEBUG ?????????
logging.level.root=info
logging.level.com.yourpackage=info

# ??????????????
logging.file.name=   # ????????????????

# MyBatis SQL??????????
logging.level.org.mybatis=debug
logging.level.jdbc.sqlonly=debug
logging.level.jdbc.resultset=debug
logging.level.jdbc.connection=debug

